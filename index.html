<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiView Screen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="logo"><span class="dot"></span>MultiView</h1>
        <span id="count" class="pill">0 streams</span>
        <div class="actions">
            <button id="add" class="btn primary">+ Add stream</button>
            <button id="toggle" class="btn">Hide chat</button>
            <button id="clear" class="btn">Clear all</button>
            <button id="layout" class="btn">Focus view</button>
        </div>
    </header>
    <main>
        <nav id="menu">
            <div class="menu-head">
                <h2>Channels</h2>
                <button id="menuToggle" class="icon-btn" aria-label="Collapse menu">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 5l-7 7 7 7" />
                    </svg>
                </button>
            </div>
            <div id="list"></div>
        </nav>
        <div id="grid"></div>
        <aside id="side">
            <h2>Live Chat</h2>
            <div id="tabs"></div>
            <iframe id="chat" title="Live-chat"></iframe>
        </aside>
    </main>
    <dialog id="dlg">
        <h3>Add a YouTube stream</h3>
        <p class="hint">Paste a video or live link, or an 11-character video ID.</p>
        <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <p id="err" class="err"></p>
        <div class="dlg-actions">
            <button id="cancel" class="btn">Cancel</button>
            <button id="ok" class="btn primary">Add stream</button>
        </div>
    </dialog>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
